<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}EcoEnergy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listado_zonas' %}">EcoEnergy</a>
            <div>
                <a class="nav-link text-white d-inline" href="{% url 'listado_zonas' %}">Inicio</a>

            </div>
